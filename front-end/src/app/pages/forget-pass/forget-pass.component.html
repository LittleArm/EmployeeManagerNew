<!-- forget password card if not submmitted, else show the link to login page -->
<div class="container-fluid card login-container" *ngIf="!submitted else loginLink">
    <h3 class="text-center">Forget Password</h3>
    <hr>
    <div class="alert alert-danger" role="alert" *ngIf="errorMessage.length">
        <p *ngFor="let message of errorMessage">{{message}}</p>
    </div>
    <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input [(ngModel)]="email"  type="email" class="form-control" id="email" placeholder="Your email">
    </div>
    <div class="d-flex justify-content-between mb-3">
        <button (click)="resetPassword()" type="button" class="btn btn-primary">
            Submit
        </button>
        <div>
            Back to login?&nbsp;
            <button (click)="login()" type="button" class="btn btn-link">
                Login
            </button>
        </div>
    </div>
</div>

<ng-template #loginLink>
    <div class="container-fluid card login-container">
        <h3 class="text-center">Forget Password</h3>
        <hr>
        <div class="alert alert-success" role="alert">
            <p>An email has been sent to your email address. Please check your email to reset your password.</p>
        </div>
        <div class="d-flex justify-content-between mb-3">
            <button (click)="login()" type="button" class="btn btn-primary">
                Login
            </button>
        </div>
    </div>
</ng-template>
