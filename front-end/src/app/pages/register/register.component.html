<div class="container-fluid card register-container">
<h3 class="text-center">Create a new account</h3>
<hr>
<div class="alert alert-danger" role="alert" *ngIf="errorMessage.length">
    <p *ngFor="let message of errorMessage">{{message}}</p>
</div>
<div class="mb-3">
    <label for="firstname" class="form-label">First Name</label>
    <input [(ngModel)]="registrationRequest.firstname" type="text" class="form-control" id="firstname" placeholder="Your first name">
</div>
<div class="mb-3">
    <label for="lastname" class="form-label">Last Name</label>
    <input [(ngModel)]="registrationRequest.lastname" type="email" class="form-control" id="lastname" placeholder="Your last name">
</div>
<div class="mb-3">
    <label for="email" class="form-label">Email Address</label>
    <input [(ngModel)]="registrationRequest.email" type="email" class="form-control" id="email" placeholder="Your email">
</div>
<div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input [(ngModel)]="registrationRequest.password" type="password" class="form-control" id="password" placeholder="Password">
</div>
<div class="d-flex justify-content-between mb-3">
    <button (click)="register()" type="button" class="btn btn-primary">
    Sign up
    </button>
    <div>
    Already have an account?&nbsp;
    <button (click)="login()" type="button" class="btn btn-link">
        Sign in
    </button>
    </div>
</div>
</div>
