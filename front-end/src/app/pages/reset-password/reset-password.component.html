<div class="container-fluid card login-container">
    <h3 class="text-center">Reset Password</h3>
    <hr>
    <!-- <div class="alert alert-danger" role="alert" *ngIf="errorMessage.length">
        <p *ngFor="let message of errorMessage">{{message}}</p>
    </div> -->
    <div class="mb-3">
      <label for="newPassword" class="form-label">New Password</label>
      <input [(ngModel)]="resetRequest.newPassword" type="password" class="form-control" id="newPassword" placeholder="New Password">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Confirm Password</label>
      <input [(ngModel)]="resetRequest.confirmPassword" type="password" class="form-control" id="confirmPassword" placeholder="Confirm Password">
    </div>
    <div class="d-flex justify-content-between mb-3">
      <button (click)="resetPassword()" type="button" class="btn btn-primary">
        Submit
      </button>
      <div>
        Back to login?&nbsp;
        <button (click)="login()" type="button" class="btn btn-link">
          Login
        </button>
      </div>
    </div>
  </div>
